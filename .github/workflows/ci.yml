name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    name: Backend · SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e backend
      - name: Ejecutar pruebas
        working-directory: backend
        run: python -m unittest discover

  backend-postgresql:
    name: Backend · PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prestamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prestamos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/prestamos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e backend
      - name: Ejecutar integración PostgreSQL
        working-directory: backend
        run: python -m unittest tests.test_postgresql

  frontend:
    name: Frontend · Astro
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
