[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prestamos-academicos"
version = "0.1.0"
description = "API y modelo de dominio del Sistema de Préstamos Académicos"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "psycopg>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["prestamos_academicos*"]
